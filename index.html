<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Science Admission Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a calm study app — sticky app bar with unit switcher, one centred 880px column; each unit is a hub with a scrollable tab strip. OMR-sheet bubbles mark every answer choice. */
:root{
  --paper:#f3f5f9; --sheet:#ffffff; --sheet-2:#f8f9fc; --ink:#171c28; --muted:#5d6577; --faint:#8a92a3; --line:#e2e6ee; --line-2:#d3d9e4;
  --omr:#c8325f; --omr-soft:#fbe6ed;
  --du:#2756c5; --jua:#b8482a; --jud:#1d7f55; --jnu:#7a3c9e;
  --good:#16794a; --good-soft:#e3f4ea; --hl:#e3f4ea; --hl-ink:#0f3d26; --bad:#c03434; --bad-soft:#fbe7e6;
  --shadow:0 1px 2px rgba(20,30,55,.05),0 2px 8px rgba(20,30,55,.04);
  --shadow-up:0 2px 4px rgba(20,30,55,.06),0 10px 24px rgba(20,30,55,.08);
  --f-display:"Anek Bangla","Hind Siliguri",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Noto Sans Bengali","Hind Siliguri",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1118; --sheet:#171b25; --sheet-2:#1c212d; --ink:#e9ecf3; --muted:#a2a9b9; --faint:#7d8597; --line:#262c3a; --line-2:#323a4b;
  --omr:#f0729a; --omr-soft:#3a1f2b;
  --du:#7ea2f2; --jua:#f0916f; --jud:#5fcb97; --jnu:#c79be6;
  --good:#5fd39a; --good-soft:#15301f; --hl:#15301f; --hl-ink:#d7f7e5; --bad:#f28b85; --bad-soft:#3a1d1f;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-up:0 2px 6px rgba(0,0,0,.35),0 12px 28px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1118; --sheet:#171b25; --sheet-2:#1c212d; --ink:#e9ecf3; --muted:#a2a9b9; --faint:#7d8597; --line:#262c3a; --line-2:#323a4b;
  --omr:#f0729a; --omr-soft:#3a1f2b;
  --du:#7ea2f2; --jua:#f0916f; --jud:#5fcb97; --jnu:#c79be6;
  --good:#5fd39a; --good-soft:#15301f; --hl:#15301f; --hl-ink:#d7f7e5; --bad:#f28b85; --bad-soft:#3a1d1f;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-up:0 2px 6px rgba(0,0,0,.35),0 12px 28px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--uc,var(--du))}
:focus-visible{outline:2px solid var(--uc,var(--omr));outline-offset:2px}

/* ---- app bar ---- */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--sheet) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"brand nav tools";align-items:center;gap:16px;padding-block:10px}
.brand{grid-area:brand;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.2px;display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand .dot{width:28px;height:28px;border-radius:9px;background:var(--omr);display:grid;place-items:center;flex:none}
.brand .dot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--sheet);box-shadow:inset 0 0 0 3px var(--sheet),0 0 0 2px var(--sheet)}
.unitnav{grid-area:nav;justify-self:center;display:flex;gap:2px;background:var(--paper);padding:4px;border-radius:12px;border:1px solid var(--line)}
.unitnav a{color:var(--muted);text-decoration:none;font-weight:600;padding:6px 12px;border-radius:9px;font-size:15px;white-space:nowrap;text-align:center;transition:background .15s,color .15s}
.unitnav a:hover{color:var(--ink)}
.unitnav a[aria-current="page"]{background:var(--sheet);color:var(--ink);box-shadow:var(--shadow)}
.tools{grid-area:tools;display:flex;gap:8px;align-items:center}
.themebtn{font:inherit;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer}
.themebtn:hover{border-color:var(--line-2)}
.langseg button{padding:4px 10px;font-size:13px}
.langseg button.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
@media (max-width:680px){
  .bar .wrap{grid-template-columns:1fr auto;grid-template-areas:"brand tools" "nav nav";gap:10px;padding-block:10px 10px}
  .brand{font-size:17px}
  .unitnav{justify-self:stretch;display:grid;grid-template-columns:repeat(5,1fr)}
  .unitnav a{padding:7px 2px;font-size:13px}
  #themelabel{display:none}
  .themebtn{padding:7px}
}

main{padding-block:24px 72px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.3px;line-height:1.25}
h1{font-size:clamp(28px,5vw,38px);font-weight:800;line-height:1.15}
h2{font-size:22px;font-weight:700}
h3{font-size:18px;font-weight:700}
.lede{color:var(--muted);margin:8px 0 0;max-width:62ch;font-size:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec-h{font-size:13px;font-family:var(--f-body);font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin:8px 0 -4px}

/* ---- surfaces ---- */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
@media (max-width:480px){.sheet{padding:16px}}
.unit .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.unit .sub{color:var(--muted);font-size:15px}
.pill{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--uc,var(--ink)) 12%,transparent);color:var(--uc,var(--ink));font-weight:700;font-size:14px;padding:4px 12px;border-radius:999px;white-space:nowrap}
.k{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700}
.v{font-weight:700;font-size:17px;line-height:1.4;text-wrap:balance}
.v small{display:block;font-weight:400;font-size:14px;line-height:1.55;color:var(--muted);margin-top:4px;text-wrap:balance}
.ok{color:var(--good)!important}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
@media (max-width:520px){.facts{grid-template-columns:1fr}}
.fact{background:var(--sheet-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid color-mix(in srgb,var(--uc,var(--line)) 45%,var(--line));border-radius:8px;padding:3px 10px;font-size:14px;font-weight:600;background:var(--sheet)}
.chip b{font-family:var(--f-mono);font-size:13px;color:var(--uc,var(--omr));margin-left:6px}
.chip.dash{border-style:dashed}
.note{font-size:14px;color:var(--muted);margin:8px 0 0;line-height:1.6}
.warn{color:var(--bad);font-size:14px;font-weight:600}

/* ---- buttons ---- */
.btn{font:inherit;font-weight:700;border:1px solid transparent;border-radius:var(--r-sm);padding:10px 18px;min-height:44px;cursor:pointer;background:var(--ink);color:var(--sheet);font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,box-shadow .15s,background .15s;line-height:1.3}
.btn:hover:not(:disabled){box-shadow:var(--shadow-up)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.ghost{background:var(--sheet);color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover:not(:disabled){border-color:var(--uc,var(--ink));box-shadow:none}
.unit-btn{background:var(--uc)!important;color:var(--sheet)!important}
.btn:disabled{opacity:.45;cursor:not-allowed}
a.btn{text-decoration:none}
.linkbtn{font:inherit;font-size:14px;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
.linkbtn:hover{color:var(--ink)}

/* ---- home ---- */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:24px}
.hero h1{margin-top:4px}
.cand{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.cand .name{font-weight:700;font-size:18px}
.cand .meta{color:var(--muted);font-size:15px}
.gpa{font-family:var(--f-mono);font-weight:700;font-size:34px;line-height:1;text-align:center;background:var(--sheet-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;font-variant-numeric:tabular-nums}
.gpa .k{display:block;margin-bottom:6px;font-family:var(--f-body)}
.gpa small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:6px}
@media (max-width:560px){.hero{grid-template-columns:1fr}.gpa{display:flex;align-items:baseline;justify-content:space-between;gap:10px;text-align:left;flex-wrap:wrap}.gpa .k{margin:0;width:100%}}
.unitgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.unitgrid{grid-template-columns:1fr}}
a.unit-link{display:flex;flex-direction:column;gap:12px;color:inherit;text-decoration:none;transition:border-color .15s,box-shadow .15s,transform .15s}
a.unit-link:hover{border-color:color-mix(in srgb,var(--uc) 55%,var(--line));box-shadow:var(--shadow-up)}
.ul-top{display:flex;gap:12px;align-items:center}
.mono{flex:none;width:44px;height:44px;border-radius:12px;background:var(--uc);color:var(--sheet);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:14px;letter-spacing:-.3px}
.ul-top h2{font-size:18px}
.ul-top .sub{color:var(--muted);font-size:14px;line-height:1.4}
.ul-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line);margin-top:auto}
.ul-meta .note{margin:0;font-size:13px}
.go{font-weight:700;color:var(--uc);white-space:nowrap}
.count{display:inline-flex;align-items:baseline;gap:5px;font-size:14px;color:var(--muted);font-weight:600;white-space:nowrap}
.count b{font-family:var(--f-mono);font-size:20px;color:var(--uc,var(--ink));font-variant-numeric:tabular-nums}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.step{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);line-height:1.5}
.step b{color:var(--ink);font-family:var(--f-display);font-size:16px}

/* ---- unit hub ---- */
.unit-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 16px;flex-wrap:wrap}
.unit-hero .k{color:var(--uc)}
.unit-hero .when{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
@media (max-width:560px){.unit-hero .when{align-items:flex-start;flex-direction:row;flex-wrap:wrap;gap:8px}}
.subnav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-inline:-4px;padding-inline:4px;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.subnav::-webkit-scrollbar{display:none}
.subnav a{flex:none;color:var(--muted);text-decoration:none;font-weight:600;font-size:15px;padding:10px 12px;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;scroll-snap-align:start;transition:color .15s}
.subnav a:hover{color:var(--ink)}
.subnav a[aria-current="page"]{color:var(--uc);border-bottom-color:var(--uc)}
@media (min-width:820px){.subnav{-webkit-mask-image:none;mask-image:none}}

/* ---- segmented filters ---- */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.seg label{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line-2);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,background .15s}
.seg button:hover,.seg label:hover{border-color:var(--uc,var(--ink))}
.seg button.on{background:var(--uc,var(--ink));border-color:var(--uc,var(--ink));color:var(--sheet)}
.seg input{accent-color:var(--uc)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 12px;cursor:pointer;font-weight:600;background:var(--sheet);min-height:44px}
.pick label:has(input:checked){border-color:var(--uc);background:color-mix(in srgb,var(--uc) 8%,var(--sheet))}
.pick input{accent-color:var(--uc);width:18px;height:18px}
.checkline{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:600;line-height:1.4}
.checkline input{accent-color:var(--uc);width:20px;height:20px;flex:none}
.checks{display:flex;flex-direction:column}

/* ---- tags ---- */
.tag{font-family:var(--f-body);font-weight:700;font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.skip{background:var(--paper);color:var(--muted)}
.tag.yr{background:var(--omr-soft);color:var(--omr)}
.seenbadge{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;color:var(--omr);background:var(--omr-soft);border-radius:999px;padding:1px 8px;vertical-align:middle}

/* ---- questions (OMR sheet) ---- */
.q{display:flex;flex-direction:column;gap:14px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.qtext{font-size:18px;font-weight:600;line-height:1.65;overflow-wrap:anywhere}
.qn{font-family:var(--f-mono);font-weight:700;color:var(--muted);margin-right:6px;font-size:.88em}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts.long{grid-template-columns:1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:50px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--sheet);cursor:pointer;text-align:left;font:inherit;font-size:16px;color:inherit;width:100%;min-width:0;line-height:1.45;transition:border-color .12s,background .12s}
.opt>span:last-child{min-width:0;overflow-wrap:anywhere}
div.opt{cursor:default}
button.opt:hover:not(:disabled){border-color:var(--uc,var(--ink));background:var(--sheet-2)}
.bubble{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--muted);background:var(--sheet)}
.opt.sel{border-color:var(--ink);background:var(--sheet-2)}
.opt.sel .bubble{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.opt.right{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 55%,transparent);color:var(--hl-ink);font-weight:600}
.opt.right .bubble{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.wrong{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.opt.wrong .bubble{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt:disabled{cursor:default}
.explain{background:var(--sheet-2);border:1px solid var(--line);padding:12px 14px;border-radius:var(--r-sm);font-size:15px;line-height:1.65}
.explain b:first-child{color:var(--good)}
.alt{display:block;color:var(--muted);font-weight:500;font-size:.92em;margin-top:2px}

/* ---- mock ---- */
.timer{font-family:var(--f-mono);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 12px}
.timer.low{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:var(--bad-soft)}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--uc,var(--omr));width:0;border-radius:99px}
.omrgrid{display:flex;flex-wrap:wrap;gap:6px}
.omrgrid button{width:36px;height:36px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--omr) 60%,var(--line));background:var(--sheet);color:var(--omr);font-family:var(--f-mono);font-weight:700;font-size:12px;cursor:pointer}
.omrgrid button.done{background:var(--omr);border-color:var(--omr);color:var(--sheet)}
.omrgrid button.cur{box-shadow:0 0 0 3px var(--omr-soft)}
.score{font-family:var(--f-mono);font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}

/* ---- tables & lists ---- */
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.tblwrap{overflow-x:auto}
.chlist{padding:6px}
.chrow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 12px;cursor:pointer;border-radius:8px}
.chrow:last-child{border-bottom:0}
.chrow:hover:not(:disabled){background:var(--sheet-2)}
.chrow:disabled{cursor:default;opacity:.5}
.chno{font-family:var(--f-mono);font-size:12px;color:var(--uc);min-width:92px}
.chname{font-weight:600;min-width:0}
.chcount{font-family:var(--f-mono);font-size:13px;color:var(--muted);background:var(--paper);border-radius:999px;padding:2px 10px}
@media (max-width:480px){.chrow{grid-template-columns:1fr auto;gap:2px 12px}.chno{grid-column:1/-1;min-width:0}}
.empty{text-align:left}

/* ---- forms ---- */
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
form label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
form input,form select,form textarea{font:inherit;font-weight:400;font-size:16px;color:var(--ink);background:var(--sheet-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 12px;width:100%}
form input:focus,form select:focus,form textarea:focus{outline:2px solid var(--uc);outline-offset:1px}
.wbox{font:inherit;font-size:16px;width:100%;color:var(--ink);background:var(--sheet-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:12px 14px;resize:vertical}
.wbox:focus{outline:2px solid var(--uc);outline-offset:1px}

/* ---- revision tools ---- */
.tight{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.lastgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.facts-list{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.duebox{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:76px;padding:8px 10px;border-radius:12px;background:var(--omr-soft);color:var(--omr)}
.duebox b{font-family:var(--f-mono);font-size:26px;line-height:1}
.duebox span{font-size:12px;font-weight:600}
.wordpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.wordpick button{font:inherit;font-size:15px;border:1px solid var(--line-2);background:var(--sheet);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.wordpick button.on{background:var(--uc);border-color:var(--uc);color:var(--sheet)}
.linetext{font-size:17px;line-height:1.75;overflow-wrap:anywhere}
.linetext.big{font-size:20px}
.blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--omr);color:transparent}
mark.hid{background:var(--omr-soft);color:var(--omr);font-weight:700;padding:0 4px;border-radius:4px}
.tricks{background:color-mix(in srgb,var(--uc) 5%,var(--sheet))}
.yearlinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.yearlinks a{font-family:var(--f-mono);font-size:14px;font-weight:700;text-decoration:none;color:var(--uc);border:1px solid var(--uc);border-radius:10px;padding:7px 14px;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.yearlinks a:hover{filter:brightness(1.08);box-shadow:var(--shadow-up)}
.rule{font-size:15px;line-height:1.6;color:var(--ink);background:var(--sheet-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin:8px 0 0}
.imptype h3{margin:0}
@media (prefers-reduced-motion:no-preference){.progress i{transition:width .3s}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- mobile app layout ---- */
:root{--hdr:58px}
@media (max-width:680px){
  header.bar{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--sheet)}
  .bar .wrap{grid-template-columns:1fr auto;grid-template-areas:"brand tools";padding-block:8px}
  .unitnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-radius:0;border:0;border-top:1px solid var(--line);background:color-mix(in srgb,var(--sheet) 94%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(20,30,55,.06)}
  .unitnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;padding:4px 2px;font-size:13px;border-radius:12px}
  .unitnav a::before{content:"";width:22px;height:4px;border-radius:99px;background:transparent;transition:background .15s}
  .unitnav a[aria-current="page"]{background:color-mix(in srgb,var(--du) 10%,var(--sheet));color:var(--du);box-shadow:none}
  .unitnav a[aria-current="page"]::before{background:var(--du)}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .subnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr));z-index:4;background:var(--paper);margin-inline:-16px;padding-inline:12px}
  .unit-hero h1{font-size:26px}
  .sheet .facts .fact{padding:10px 12px}
  .q .row .btn{flex:1 1 auto}
  main{padding-top:14px}
  .unit-hero.compact{align-items:center}
  .unit-hero.compact .k{font-size:11px}
  .unit-hero.compact h1{font-size:19px;line-height:1.3}
  .unit-hero.compact .when{display:none}
  .linkbtn{min-height:44px;display:inline-flex;align-items:center}
  .stack{gap:14px}
}
section.sheet:has(> .row .timer),section.sheet:has(.timer){position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 54px);z-index:4;box-shadow:var(--shadow-up)}

 $("#go").onclick=()=>{const plan={...m.fixed};boxes.filter(b=>b.checked).forEach(b=>plan[b.value]=m.optional[b.value]);
  const div=+app.querySelector('input[name="len"]:checked').value;
  if(div>1)for(const s in plan)plan[s]=Math.max(1,Math.round(plan[s]/div));
  const n=Object.values(plan).reduce((a,b)=>a+b,0);
  const subs=Object.keys(plan);const wr=$("#addwritten")&&$("#addwritten").checked?{subs}:null;
  startMock(k,plan,Math.max(5,Math.round(m.mins*n/total)),$("#usepast").checked,wr)};
}
function pick(k,s,n,usePast){
 const past=usePast?shuffle(pastFor(k,s)):[];
 const book=s==="bio"?[...shuffle(pool("bot")).slice(0,Math.ceil(n/2)),...shuffle(pool("zoo")).slice(0,Math.floor(n/2))]:shuffle(pool(s));
 return [...past,...book].slice(0,n);
}
function startMock(k,plan,mins,usePast,wr){
 const m=MOCK[k];
 let qs=[];
 for(const [s,n] of Object.entries(plan))qs.push(...pick(k,s,n,usePast).map(q=>({...q,sec:s==="bio"?"Biology":SUBJ[s].n})));
 const ans=new Array(qs.length).fill(null);let cur=0,left=mins*60;
 const fmt=t=>`${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`;
 const render=()=>{
  CUR=render;const q=qs[cur],done=ans.filter(a=>a!==null).length;
  app.innerHTML=hubFrame(k,"mock",`<div class="mocking"></div><section class="sheet"><div class="row" style="justify-content:space-between"><span class="note" style="margin:0">${done}/${qs.length} answered · −${+m.neg.toFixed(2)} per wrong</span><div class="timer" id="timer">${fmt(left)}</div></div>
   <div class="progress" style="margin-top:10px"><i style="width:${done/qs.length*100}%"></i></div></section>
   <section class="sheet q"><div class="qtop"><span>Q${cur+1} of ${qs.length}</span><span>${q.sec}</span></div><div class="qtext">${qn(cur+1)}${qT(q)}${qImg(q)}</div>
    <div class="opts${isLong(q)?" long":""}">${q.o.map((o,j)=>`<button class="opt ${ans[cur]===j?"sel":""}" data-j="${j}"><span class="bubble">${LT(j)}</span><span>${oT(q,j)}</span></button>`).join("")}</div>
    <div class="row"><button class="btn ghost" id="prev" ${cur?"":"disabled"}>Previous</button><button class="btn ghost" id="clear" ${ans[cur]===null?"disabled":""}>Clear answer</button><button class="btn unit-btn" id="nxt">${cur+1<qs.length?"Next":"Go to submit"}</button></div></section>
   <section class="sheet"><div class="k" style="margin-bottom:8px">Answer sheet · tap a number to jump</div>
    <div class="omrgrid">${qs.map((_,i)=>`<button class="${ans[i]!==null?"done":""} ${i===cur?"cur":""}" data-i="${i}" aria-label="Question ${i+1}">${i+1}</button>`).join("")}</div>
    <div class="row" style="margin-top:14px"><button class="btn unit-btn" id="submit">Submit test</button></div>
    <div id="confirm"></div></section>`);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[cur]=+b.dataset.j;render()});
  app.querySelectorAll(".omrgrid button").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render()});
  $("#prev").onclick=()=>{cur--;render()};
  $("#clear").onclick=()=>{ans[cur]=null;render()};
  $("#nxt").onclick=()=>{if(cur+1<qs.length){cur++;render()}else{$("#submit").scrollIntoView({block:"center"});$("#submit").focus()}};
  $("#submit").onclick=()=>{const un=ans.filter(a=>a===null).length;
   if(!un)return finish();
   $("#confirm").innerHTML=`<p class="warn" style="margin-top:10px">${un} question${un>1?"s are":" is"} unanswered. Unanswered questions score 0.</p><div class="row"><button class="btn unit-btn" id="sure">Submit anyway</button><button class="btn ghost" id="keep">Keep going</button></div>`;
   $("#sure").onclick=finish;$("#keep").onclick=()=>$("#confirm").innerHTML=""};
 };
 const finish=()=>{stopTimer();showResult(k,qs,ans,wr)};
 stopTimer();
 timerId=setInterval(()=>{left--;const t=$("#timer");if(t){t.textContent=fmt(left);t.classList.toggle("low",left<=60)}if(left<=0)finish()},1000);
 render();
}
function showResult(k,qs,ans,wr){
 const m=MOCK[k];
 let c=0,w=0;const by={};
 qs.forEach((q,i)=>{by[q.sec]=by[q.sec]||{c:0,w:0,n:0};by[q.sec].n++;if(ans[i]===null)return;if(ans[i]===q.a){c++;by[q.sec].c++}else{w++;by[q.sec].w++}});
 const net=Math.max(0,c-w*m.neg),pct=Math.round(net/qs.length*100);
 const prev=store("best_"+k);if(!prev||pct>prev.pct)store("best_"+k,{pct});
 const passNote=(k==="du"||k==="jnu")?"":`<p class="note">JU's pass mark is 45%. ${pct>=45?"You are above it on this mock.":"You are below it on this mock."}</p>`;
 const render=f=>{
  CUR=()=>render(f);
  const list=qs.map((q,i)=>({q,i,a:ans[i]})).filter(x=>f==="all"||(f==="wrong"&&x.a!==null&&x.a!==x.q.a)||(f==="skip"&&x.a===null));

   <div class="row" style="margin-top:14px">${wr?`<button class="btn unit-btn" id="towritten">Continue to the written part →</button><button class="btn ghost" id="again">New mock</button>`:`<button class="btn unit-btn" id="again">New mock</button>`}</div>
   ${wr?`<p class="note">Check your MCQ answers below first, or go straight to the written part. Your MCQ score carries over.</p>`:""}</section>
   <div class="row" style="justify-content:space-between"><h2>Every question with its answer</h2>
    <div class="seg"><button class="${f==="all"?"on":""}" data-f="all">All ${qs.length}</button><button class="${f==="wrong"?"on":""}" data-f="wrong">Wrong ${w}</button><button class="${f==="skip"?"on":""}" data-f="skip">Skipped ${qs.length-c-w}</button></div></div>
   ${list.length?list.map(x=>answerCard(x.q,x.i,x.a,true)).join(""):`<p class="note">Nothing here.</p>`}`);
  $("#again").onclick=()=>unitMock(k);
  if(wr)$("#towritten").onclick=()=>{location.hash!=="#du-written"&&history.replaceState(null,"","#du-written");writtenMock(k,wr.subs,{net,of:qs.length})};
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>render(b.dataset.f));
 };
 render("all");window.scrollTo(0,0);
}

function route(keep){
 if(!keep)stopTimer();
 const h=location.hash.slice(1);
 const [k,tab]=h.split("-");
 document.querySelectorAll("header nav a").forEach(a=>{if(a.dataset.r===(UNITS[k]?k:"home"))a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
 CUR=()=>route(true);
 if(!UNITS[k])home();
 else if(tab==="textbook")unitTextbook(k);
 else if(tab==="past")unitPast(k);
 else if(tab==="mock")unitMock(k);
 else if(tab==="last")unitLast(k);

 else if(tab==="written"&&k==="du")unitWritten(k);
 else unitOverview(k);
 if(!keep)window.scrollTo(0,0);
}

["bio",2,"Write two differences between mitosis and meiosis.","Mitosis: one division, giving 2 identical diploid cells. Meiosis: two divisions, giving 4 haploid cells, with crossing over.","মাইটোসিস ও মিয়োসিসের দুটি পার্থক্য লেখো।","মাইটোসিস: একবার বিভাজন, ২টি অভিন্ন ডিপ্লয়েড কোষ। মিয়োসিস: দুবার বিভাজন, ক্রসিং ওভারসহ ৪টি হ্যাপ্লয়েড কোষ।"],
["bio",3,"Write the overall equation of photosynthesis and say where its two stages take place.","6CO₂ + 12H₂O → (light, chlorophyll) C₆H₁₂O₆ + 6O₂ + 6H₂O. Light reaction: thylakoid membrane; dark reaction (Calvin cycle): stroma.","সালোকসংশ্লেষণের সামগ্রিক সমীকরণ লেখো এবং এর দুটি পর্যায় কোথায় ঘটে উল্লেখ করো।","6CO₂ + 12H₂O → (আলো, ক্লোরোফিল) C₆H₁₂O₆ + 6O₂ + 6H₂O। আলোক পর্যায়: থাইলাকয়েড ঝিল্লি; অন্ধকার পর্যায় (ক্যালভিন চক্র): স্ট্রোমা।"],
["bio",5,"Describe the path of blood through the human heart, starting from the vena cava.","Vena cava → right atrium → tricuspid valve → right ventricle → pulmonary artery → lungs (oxygenated) → pulmonary vein → left atrium → bicuspid (mitral) valve → left ventricle → aorta → body.","মহাশিরা থেকে শুরু করে মানব হৃৎপিণ্ডের মধ্য দিয়ে রক্তের গমনপথ বর্ণনা করো।","মহাশিরা → ডান অলিন্দ → ট্রাইকাসপিড কপাটিকা → ডান নিলয় → পালমোনারি ধমনি → ফুসফুস (অক্সিজেনযুক্ত হয়) → পালমোনারি শিরা → বাম অলিন্দ → বাইকাসপিড (মাইট্রাল) কপাটিকা → বাম নিলয় → মহাধমনি → সারা দেহ।"],
["bio",2,"What is a nephron? Name its two main parts.","The structural and functional unit of the kidney. Main parts: renal corpuscle (glomerulus + Bowman's capsule) and renal tubule.","নেফ্রন কী? এর প্রধান দুটি অংশের নাম লেখো।","বৃক্কের গঠনগত ও কার্যগত একক। প্রধান অংশ: রেনাল করপাসল (গ্লোমেরুলাস + বোম্যানস ক্যাপসুল) ও রেনাল নালিকা।"],
["bio",3,"For a cross between two heterozygous tall pea plants (Tt × Tt), give the genotypic and phenotypic ratios.","Genotypes TT : Tt : tt = 1 : 2 : 1. Phenotypes tall : dwarf = 3 : 1.","দুটি হেটারোজাইগাস লম্বা মটর গাছের (Tt × Tt) সংকরায়ণে জিনোটাইপ ও ফিনোটাইপ অনুপাত লেখো।","জিনোটাইপ TT : Tt : tt = 1 : 2 : 1। ফিনোটাইপ লম্বা : খাটো = 3 : 1।"],
["bio",5,"Name the four ABO blood groups and explain why O− is the universal donor.","A, B, AB and O. O− red cells carry no A, B or Rh(D) antigens, so a recipient's antibodies do not attack them.","মানুষের চারটি রক্তগ্রুপের (ABO) নাম লেখো এবং O− কেন সর্বজনীন দাতা ব্যাখ্যা করো।","A, B, AB, O। O− লোহিত কণিকায় A, B বা Rh(D) অ্যান্টিজেন থাকে না, তাই গ্রহীতার অ্যান্টিবডি সেগুলোকে আক্রমণ করে না।"],
["bio",2,"Why is the mitochondrion called the powerhouse of the cell?","Aerobic respiration (Krebs cycle and electron transport) happens there and makes most of the cell's ATP.","মাইটোকন্ড্রিয়াকে কোষের শক্তিঘর বলা হয় কেন?","এখানে সবাত শ্বসনের ক্রেবস চক্র ও ইলেকট্রন পরিবহন ঘটে, যা কোষের বেশিরভাগ ATP তৈরি করে।"],

const WRPAST=[["phy","২০২২–২৩","একটি সরল দোল গতিসম্পন্ন বস্তুর ব্যবকলনীয় সমীকরণ লিখ। দেখাও যে x = A sin(ωt + φ) উক্ত সমীকরণের একটি সমাধান।","সমীকরণ: d²x/dt² + ω²x = 0। x = A sin(ωt + φ) হলে dx/dt = Aω cos(ωt + φ), d²x/dt² = −Aω² sin(ωt + φ) = −ω²x। বসালে −ω²x + ω²x = 0 = ডানপক্ষ, তাই এটি একটি সমাধান।"],["phy","২০২২–২৩","একটি বর্তনীতে E = 9 V কোষের সাথে R₀ = 2 Ω শ্রেণিতে যুক্ত। এরপর R₁ = 6 Ω এর সাথে সমান্তরালে আছে R₂ = 4 Ω ও R₃ = 8 Ω (এ দুটি নিজেরা শ্রেণিতে)। বর্তনীর মূল প্রবাহ I₀, R₁ দিয়ে প্রবাহ I₁ এবং R₂-R₃ দিয়ে প্রবাহ I₂₃ নির্ণয় কর।","R₂ + R₃ = 12 Ω; 12 Ω ও 6 Ω সমান্তরালে = 4 Ω; মোট রোধ 4 + 2 = 6 Ω। I₀ = 9/6 = 1.5 A। I₁ = 1.5 × 12/18 = 1 A, I₂₃ = 1.5 × 6/18 = 0.5 A।"],["phy","২০২২–২৩","a⃗ = αî + 2ĵ − βk̂ ভেক্টরটি b⃗ = î + ĵ এবং c⃗ = ĵ + k̂ এর সাথে সমান কোণ θ তৈরি করে এবং a⃗, b⃗, c⃗ একই সমতলে অবস্থিত। α ও β এর মান নির্ণয় কর।","সমান কোণ: a⃗·b⃗/|b⃗| = a⃗·c⃗/|c⃗| ⇒ α + 2 = 2 − β ⇒ α = −β। সমতলীয় হলে নির্ণায়ক |α 2 −β; 1 1 0; 0 1 1| = 0 ⇒ α − 2 − β = 0। সমাধান: α = 1, β = −1। (সমাধান বইয়ে k̂ এর সহগ +β ধরে α = β = 1 দেখানো হয়েছে)"],["phy","২০২২–২৩","m ভরের একটি মিটার স্কেল সমদ্রুতিতে এর দৈর্ঘ্য বরাবর চলমান। স্কেলটির আপেক্ষিক দৈর্ঘ্য 60 cm এবং আপেক্ষিক ভরবেগ 8 J/c হলে (c = শূন্য মাধ্যমে আলোর বেগ), মিটার স্কেলটির আপেক্ষিক শক্তি কত?","L = L₀√(1 − v²/c²) ⇒ 0.6 = √(1 − v²/c²) ⇒ v = 0.8c। E = mc² = (p/v)c² = (8 J/c ÷ 0.8c) × c² = 10 J।"],["che","২০২২–২৩","(a) অনুবন্ধী এসিড ও অনুবন্ধী ক্ষার কী? (b) পানির বিশুদ্ধতার তিনটি মানদণ্ড লিখ।","(a) ক্ষার প্রোটন (H⁺) গ্রহণ করে যে কণা হয় তা তার অনুবন্ধী এসিড; এসিড প্রোটন ত্যাগ করে যে কণা হয় তা তার অনুবন্ধী ক্ষার। যেমন NH₃ + HCl → NH₄⁺ + Cl⁻: NH₄⁺ হলো NH₃ এর অনুবন্ধী এসিড, Cl⁻ হলো HCl এর অনুবন্ধী ক্ষার। (b) pH, খরতা, BOD (এছাড়া DO, COD, TDS)।"],["che","২০২২–২৩","বাফার দ্রবণ কী? CH₃COOH এবং CH₃COONa এর সমমোলার দ্রবণ কীভাবে বাফার হিসেবে কাজ করে? এ দ্রবণের জন্য প্রযোজ্য হেন্ডারসন-হ্যাসেলবাখ সমীকরণ লিখ।","যে দ্রবণে অল্প এসিড বা ক্ষার যোগ করলেও pH প্রায় অপরিবর্তিত থাকে তা বাফার। এসিড যোগে: CH₃COO⁻ + H⁺ → CH₃COOH; ক্ষার যোগে: CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O। সমীকরণ: pH = pKa + log([CH₃COONa]/[CH₃COOH]); সমমোলার হলে pH = pKa।"],["che","২০২২–২৩","(a) বিক্রিয়াগুলো পূর্ণ কর: C₆H₆ →(?) C₆H₅NO₂ →(Sn + HCl) ? →(NaNO₂/HCl, 0°C) ? → C₆H₅OH। (b) SN1 এবং SN2 দ্বারা তুমি কী বোঝ?","(a) C₆H₆ →(গাঢ় HNO₃ + গাঢ় H₂SO₄, 50–60°C) C₆H₅NO₂ →(Sn/HCl) C₆H₅NH₂ →(NaNO₂/HCl, 0–5°C) C₆H₅N₂Cl →(H₂O, উত্তাপ) C₆H₅OH। (b) SN1: হার কেবল অ্যালকাইল হ্যালাইডের ঘনমাত্রার উপর নির্ভরশীল, দুই ধাপে কার্বোক্যাটায়নের মাধ্যমে; সক্রিয়তা 3° > 2° > 1°। SN2: হার RX ও নিউক্লিওফাইল দুটির উপর নির্ভরশীল, এক ধাপে; সক্রিয়তা CH₃X > 1° > 2° > 3°।"],["che","২০২২–২৩","(a) জ্যামিতিক সমাণুতার শর্তসমূহ কী কী? (b) আন্তঃআণবিক ও অন্তঃআণবিক হাইড্রোজেন বন্ধনের উদাহরণ দাও।","(a) C=C দ্বিবন্ধন বা বলয়ের কারণে ঘূর্ণন বাধাগ্রস্ত হতে হবে, এবং দ্বিবন্ধনের প্রতিটি কার্বনে দুটি ভিন্ন গ্রুপ থাকতে হবে (abC=Cab বা abC=Cad), যেমন সিস/ট্রান্স-বিউট-2-ইন। (b) আন্তঃআণবিক: প্যারা-নাইট্রোফেনল, পানি, HF; অন্তঃআণবিক: অর্থো-নাইট্রোফেনল, স্যালিসাইলিক অ্যাসিড।"],["mat","২০২২–২৩","3x² − 6x + 2 = 0 সমীকরণের মূলদ্বয় m এবং n হলে m + 1/n এবং n + 1/m মূল বিশিষ্ট সমীকরণটি নির্ণয় কর।","m + n = 2, mn = 2/3। নতুন মূলের যোগফল = (m + n) + (m + n)/mn = 2 + 3 = 5; গুণফল = mn + 2 + 1/mn = 2/3 + 2 + 3/2 = 25/6। সমীকরণ: x² − 5x + 25/6 = 0 ⇒ 6x² − 30x + 25 = 0।"],["mat","২০২২–২৩","p এর কোন মানের জন্য (4, 4) বিন্দুটি x² − 8x + py + 7 = 0 পরাবৃত্তের উপকেন্দ্র হবে?","(x − 4)² = −p(y − 9/p) ⇒ 4a = −p; উপকেন্দ্র (4, 9/p − p/4)। 9/p − p/4 = 4 ⇒ p² + 16p − 36 = 0 ⇒ p = 2 বা −18।"],["mat","২০২২–২৩","y = cos x · ln(1/(sec x + tan x)) হলে, d²y/dx² + y এর মান নির্ণয় কর।","1/(sec x + tan x) = sec x − tan x, তাই y = cos x · ln(sec x − tan x)। dy/dx = −sin x · ln(sec x − tan x) − 1; d²y/dx² = −y + tan x। সুতরাং d²y/dx² + y = tan x।"],["mat","২০২২–২৩","যদি a cos α + b sin α = a cos β + b sin β হয়, তবে দেখাও যে, cos²((α+β)/2) − sin²((α+β)/2) = (a² − b²)/(a² + b²)।","a(cos α − cos β) = b(sin β − sin α) থেকে a sin((α+β)/2) = b cos((α+β)/2), অর্থাৎ cot((α+β)/2) = a/b। বর্গ করে যোজন-বিয়োজন: (cos² − sin²)/(cos² + sin²) = (a² − b²)/(a² + b²); হর = 1, তাই প্রমাণিত।"],["bio","২০২২–২৩","Poaceae গোত্রের পাঁচটি প্রধান শনাক্তকারী বৈশিষ্ট্য লিখ।","১. কাণ্ড ফাঁপা পর্বযুক্ত (কাল্‌ম), পাতায় লিগিউল থাকে। ২. পত্রমূল কাণ্ডকে আবৃত করে (লিফ শিথ)। ৩. পুষ্প স্পাইকলেটে সাজানো, লেমা-প্যালিয়া থাকে। ৪. পরাগধানী সর্বমুখ। ৫. গর্ভমুণ্ড পালকের মতো, ফল ক্যারিওপসিস। উদাহরণ: ধান, গম।"],["bio","২০২২–২৩","ভাজক কলা ও স্থায়ী কলার মধ্যে পাঁচটি প্রধান পার্থক্য লিখ।","ভাজক কলার কোষ বিভাজনক্ষম, স্থায়ী কলার নয়। ভাজক কলার কোষ ছোট ও ঘন সন্নিবিষ্ট, কোষান্তর ফাঁক নেই; স্থায়ী কলায় ফাঁক থাকে। ভাজক কলায় নিউক্লিয়াস বড় ও সাইটোপ্লাজম ঘন; স্থায়ী কলায় নিউক্লিয়াস ছোট ও কোষগহ্বর বড়। ভাজক কলা বর্ধিষ্ণু অঞ্চলে থাকে; স্থায়ী কলা তার পেছনে। কোষপ্রাচীর পাতলা বনাম পুরু হতে পারে।"],["bio","২০২২–২৩","হার্ট অ্যাটাকের পাঁচটি লক্ষণ উল্লেখ কর।","১. বুকে চাপ বা তীব্র ব্যথা, যা বাম হাত, চোয়াল বা পিঠে ছড়ায়। ২. শ্বাসকষ্ট। ৩. ঘাম হওয়া। ৪. বমি বমি ভাব বা বমি। ৫. মাথা ঘোরা ও অস্থিরতা।"],["bio","২০২২–২৩","নিচের প্রাণীগুলোর বৈজ্ঞানিক নাম লিখ: (a) গৃহ মাছি (b) রুই মাছ (c) গোখরা সাপ (d) গোলকৃমি (e) দোয়েল","(a) Musca domestica (b) Labeo rohita (c) Naja naja (d) Ascaris lumbricoides (e) Copsychus saularis।"],["ban","২০২২–২৩","নিচের শব্দগুলোর মাধ্যমে বাক্য রচনা কর: পাণ্ডুর, তপোবন, মহাকাল, সাম্যবাদ, কিংবদন্তি","নমুনা: অসুখে তার মুখ পাণ্ডুর হয়ে গেছে। মুনি-ঋষিরা তপোবনে সাধনা করতেন। মহাকালের স্রোতে সবকিছু হারিয়ে যায়। কাজী নজরুল সাম্যবাদের কবি। বঙ্গবন্ধুকে নিয়ে অনেক কিংবদন্তি প্রচলিত।"],["ban","২০২২–২৩","'প্লাস্টিক দূষণ' বিষয়ে পাঁচটি বাক্যে একটি অনুচ্ছেদ রচনা কর।","নমুনা: প্লাস্টিক সহজে পচে না বলে বছরের পর বছর মাটি ও পানিতে থেকে যায়। এতে জলাবদ্ধতা হয় এবং কৃষিজমির উর্বরতা কমে। নদী ও সাগরে প্লাস্টিক জমে মাছ ও জলজ প্রাণী মারা যায়। মাইক্রোপ্লাস্টিক খাদ্যচক্র হয়ে মানুষের শরীরেও ঢুকছে। তাই প্লাস্টিকের ব্যবহার কমিয়ে পাট ও কাপড়ের ব্যাগ ব্যবহার করা জরুরি।"],["ban","২০২২–২৩","ভাবসম্প্রসারণ কর: পরের অভাব মনে করিলে চিন্তন, আপন অভাব-ক্ষোভ থাকে কতক্ষণ?","মূলভাব: নিজের দুঃখকে বড় করে দেখলে মানুষ হতাশ হয়; কিন্তু চারপাশের আরও অভাবী মানুষের দিকে তাকালে নিজের কষ্ট তুচ্ছ মনে হয়। তখন মন সন্তুষ্ট থাকে এবং অন্যের পাশে দাঁড়ানোর প্রেরণা আসে। (ভূমিকা, ব্যাখ্যা, উদাহরণ ও উপসংহার দিয়ে ১০–১২ লাইনে লেখো)"],["eng","২০২২–২৩","Make meaningful sentences with the following words: dissolve, proactive, bibliophile, perverse, rattling","Sample: Sugar dissolves quickly in warm tea. A proactive student revises before the teacher asks. My uncle is a bibliophile who owns thousands of books. It is perverse to laugh at someone in pain. The old bus kept rattling on the broken road."],["eng","২০২২–২৩","Read the extract and answer: \"I will arise and go now, and go to Innisfree, / And a small cabin build there, of clay and wattles made; / Nine bean-rows will I have there, a hive for the honey-bee, / And live alone in the bee-loud glade. / And I shall have some peace there, for peace comes dropping slow, / Dropping from the veils of the morning to where the cricket sings; / There midnight's all a glimmer, and noon a purple glow, / And evening full of the linnet's wings.\" (a) What image has been used to describe peace? (b) What are the living creatures mentioned in the poem?","(a) Peace is pictured as something that 'comes dropping slow', like dew falling softly from the veils of the morning to where the cricket sings. (b) The honey-bee (bees), the cricket and the linnet. (Poem: W. B. Yeats, 'The Lake Isle of Innisfree')"],["eng","২০২২–২৩","Write a well-organized paragraph on \"The use and abuse of advertisements\", keeping in mind the elements of a paragraph such as a topic sentence, supporting detail sentences and a conclusion.","Plan: Topic sentence — advertisements inform us but can also mislead. Support — uses: they introduce new products, compare prices, spread health and social messages, and support media and jobs. Abuse — false claims, targeting children, harmful products, and pushing people to buy what they do not need. Conclusion — rules on honest advertising and careful buyers can keep the benefits and limit the harm."],["phy","২০২৫","একটি কার্নো ইঞ্জিন T_H = 900 K এবং T_L = 300 K তাপমাত্রার মধ্যে কাজ করে। প্রতি চক্রে এটি 1200 J কাজ করে এবং প্রতি চক্রে 0.25 s সময় লাগে। উচ্চ তাপমাত্রার আধার থেকে শক্তি স্থানান্তরের কারণে প্রতি চক্রে এনট্রপির পরিবর্তন কত?","η = 1 − 300/900 = 2/3; Q_H = W/η = 1200 × 3/2 = 1800 J। ΔS = Q_H/T_H = 1800/900 = 2 J/K (কার্যকর পদার্থের এনট্রপি বৃদ্ধি)।"],["phy","২০২৫","আনুভূমিকভাবে চলমান একটি আলফা কণা (m = 4u) একটি স্থির অক্সিজেন নিউক্লিয়াসের (m = 16u) সাথে সংঘর্ষে লিপ্ত হয়। সংঘর্ষের পর আলফা কণা মূল দিকের সাথে 60° উপরে এবং অক্সিজেন নিউক্লিয়াস 30° নিচে 3 × 10⁵ m/s বেগে চলে। আলফা কণার শেষ বেগ নির্ণয় কর।","লম্ব দিকে ভরবেগ সংরক্ষণ: 4v sin60° = 16 × 3×10⁵ × sin30° ⇒ v × (√3/2) × 4 = 2.4×10⁶ ⇒ v = 2.4×10⁶/(2√3) ≈ 6.93 × 10⁵ m/s।"],["phy","২০২৫","310 nm তরঙ্গদৈর্ঘ্যের আলো একটি ধাতব পৃষ্ঠে আপতিত হয়ে সর্বোচ্চ 4 × 10⁻¹⁹ J গতিশক্তির ইলেকট্রন নির্গত করে। hc = 1240 eV·nm ধরে, এই ধাতু থেকে ইলেকট্রন নির্গত করতে পারে এমন সর্বোচ্চ তরঙ্গদৈর্ঘ্য নির্ণয় কর।","ফোটনের শক্তি = 1240/310 = 4 eV; Kmax = 4×10⁻¹⁹/1.6×10⁻¹⁹ = 2.5 eV। কার্যাপেক্ষক W = 4 − 2.5 = 1.5 eV। λmax = 1240/1.5 ≈ 827 nm।"],["phy","২০২৫","একটি গ্যাস মিশ্রণে n₁ মোল এক-পরমাণুক এবং n₂ মোল দ্বি-পরমাণুক গ্যাস আছে। মিশ্রণের γ = Cp/Cv = 3/2 হলে n₁ ও n₂ এর মধ্যে সম্পর্ক নির্ণয় কর।","মিশ্রণের Cv = (n₁·3R/2 + n₂·5R/2)/(n₁ + n₂), Cp = Cv + R। γ = 3/2 ⇒ Cv = 2R ⇒ 3n₁ + 5n₂ = 4n₁ + 4n₂ ⇒ n₁ = n₂।"],["phy","২০২৫","X ও Y দুটি বস্তু k স্প্রিং ধ্রুবকের একটি ভরহীন আদর্শ স্প্রিং দিয়ে যুক্ত। স্প্রিংটি 1.0 cm সংকুচিত অবস্থায় ঘর্ষণহীন আনুভূমিক তলে রাখা আছে। ছেড়ে দিলে স্প্রিং থেকে আলাদা হওয়ার সময় X এর গতিশক্তি 1.0 J। X এর ভর Y এর ভরের 0.4 গুণ হলে k নির্ণয় কর।","ভরবেগ সমান ও বিপরীত, তাই গতিশক্তি ভরের ব্যস্তানুপাতিক: K_Y = K_X × m_X/m_Y = 0.4 J। মোট শক্তি 1.4 J = ½k(0.01)² ⇒ k = 2.8 × 10⁴ N/m।"],["che","২০২৫","(a) CH₃CH(Cl)CH₂CH₃ কে অ্যালকোহলীয় NaOH এর সাথে উত্তপ্ত করলে উৎপন্ন সমাণুগুলোর গাঠনিক সংকেত ও নাম লিখ। (b) গ্যালভানিক কোষে লবণ সেতু কী? এর কাজ উল্লেখ কর।","(a) অপসারণ বিক্রিয়ায় CH₃CH=CHCH₃ (বিউট-2-ইন; সিস ও ট্রান্স, প্রধান উৎপাদ, জাইতসেভ নিয়ম) এবং CH₂=CHCH₂CH₃ (বিউট-1-ইন) হয়। (b) KCl/KNO₃ এর মতো তড়িৎবিশ্লেষ্যে ভরা U-নল যা দুই অর্ধকোষকে যুক্ত করে; এটি বর্তনী সম্পূর্ণ করে, দুই দ্রবণের তড়িৎ নিরপেক্ষতা বজায় রাখে এবং দ্রবণ দুটির সরাসরি মিশ্রণ রোধ করে।"],["che","২০২৫","বিক্রিয়াগুলোতে A, B, C এর স্থলে বিকারক ও শর্ত এবং P, Q এর স্থলে উৎপাদ লিখ: C₆H₆ →A C₆H₅NO₂ →B P →C C₆H₅N₂Cl →(Δ) Q + N₂ + HCl","A = গাঢ় HNO₃ + গাঢ় H₂SO₄, 50–60°C; B = Sn/HCl (বিজারণ), P = C₆H₅NH₂; C = NaNO₂ + HCl, 0–5°C; উত্তপ্ত পানিতে Q = C₆H₅OH (ফেনল)।"],["che","২০২৫","(a) দুর্বল এসিড HA ও এর লবণ NaA এর মিশ্রণ কীভাবে বাফার হিসেবে কাজ করে বিক্রিয়াসহ দেখাও। (b) 50 mL 0.01 M NaOH দ্রবণকে 100 mL 0.01 M HA দ্রবণের সাথে মেশানো হলো। HA এর Ka = 1.0 × 10⁻⁵ হলে দ্রবণের pH হিসাব কর।","(a) H⁺ যোগে A⁻ + H⁺ → HA; OH⁻ যোগে HA + OH⁻ → A⁻ + H₂O, তাই pH প্রায় স্থির থাকে। (b) NaOH = 0.5 mmol, HA = 1 mmol; বিক্রিয়ার পর HA = 0.5 mmol, A⁻ = 0.5 mmol। pH = pKa + log(1) = 5।"],["che","২০২৫","(a) Si, P ও S মৌলগুলোকে গলনাঙ্কের নিম্নক্রমে সাজাও এবং কারণ ব্যাখ্যা কর। (b) CH₃⁺ ও CH₃⁻ এ কার্বনের সংকরায়ণ ও আকৃতি লিখ।","(a) Si > S > P। Si দানবীয় সমযোজী জালক, তাই গলনাঙ্ক সবচেয়ে বেশি; S₈ অণু P₄ অণুর চেয়ে বড়, তাই ভ্যান ডার ওয়ালস আকর্ষণ বেশি ও গলনাঙ্ক বেশি। (b) CH₃⁺: sp², ত্রিকোণাকার সমতলীয়; CH₃⁻: sp³, পিরামিডাকার (একটি নিঃসঙ্গ জোড়)।"],["che","২০২৫","(a) 2SO₂(g) + O₂(g) ⇌ 2SO₃(g) বিক্রিয়ার Kc এর রাশিমালা লিখ। সাম্যাবস্থায় O₂ ও SO₃ এর ঘনমাত্রা দ্বিগুণ করলে নতুন সাম্য কোন দিকে যাবে ব্যাখ্যা কর। (b) পানির দ্রবীভূত অক্সিজেন (DO) এর সংজ্ঞা দাও। WHO অনুমোদিত BOD ও COD এর সর্বোচ্চ মাত্রা লিখ।","(a) Kc = [SO₃]²/([SO₂]²[O₂])। দ্বিগুণ করলে Qc = 4/2 × Kc = 2Kc > Kc, তাই সাম্য বাম দিকে (বিপরীত দিকে) সরবে। (b) প্রতি লিটার পানিতে দ্রবীভূত O₂ এর পরিমাণ (mg/L) হলো DO। পানযোগ্য পানির জন্য BOD সাধারণত সর্বোচ্চ ~6 mg/L এবং COD ~10 mg/L ধরা হয় (পাঠ্যবইয়ের মান মিলিয়ে নাও)।"],["che","২০২৫","বিক্রিয়াগুলোতে X, Y, Z এর স্থলে বিকারক ও শর্ত এবং P, Q এর স্থলে উৎপাদ লিখ: CH₃OH →X CH₃Cl →Y CH₃CN →Z CH₃CH₂NH₂ →(HNO₂) P + Q + H₂O","X = PCl₅ বা SOCl₂ (বা HCl/ZnCl₂); Y = অ্যালকোহলীয় KCN; Z = LiAlH₄ বা Na/C₂H₅OH (বিজারণ); P = CH₃CH₂OH, Q = N₂।"],["che","২০২৫","(a) স্ফুটনাঙ্কের সংজ্ঞা দাও। HF এর স্ফুটনাঙ্ক HCl এর চেয়ে বেশি কেন ব্যাখ্যা কর। (b) সবল এসিড-সবল ক্ষারের প্রশমন তাপ −57.3 kJ/mol ধ্রুবক হলেও দুর্বল এসিড-সবল ক্ষারের ক্ষেত্রে তা কম ঋণাত্মক হয় কেন?","(a) যে তাপমাত্রায় তরলের বাষ্পচাপ বাইরের চাপের সমান হয় সেটি স্ফুটনাঙ্ক। HF অণুগুলোর মধ্যে শক্তিশালী হাইড্রোজেন বন্ধন আছে, HCl এ নেই, তাই HF এর স্ফুটনাঙ্ক বেশি। (b) সবল এসিড-ক্ষারে কেবল H⁺ + OH⁻ → H₂O ঘটে। দুর্বল এসিড আংশিক বিয়োজিত; তাকে বিয়োজিত করতে কিছু তাপ খরচ হয়, তাই নির্গত তাপ কম।"],["che","২০২৫","(a) CCl₄, NaCl ও SiCl₄ এর কোনটি/কোনগুলো আর্দ্রবিশ্লেষিত হয় না, কারণসহ ব্যাখ্যা কর। (b) কপার সালফেটের জলীয় দ্রবণে ধীরে ধীরে অতিরিক্ত জলীয় অ্যামোনিয়া যোগ করলে সংঘটিত বিক্রিয়াগুলো লিখ।","(a) CCl₄ ও NaCl আর্দ্রবিশ্লেষিত হয় না: C এর ফাঁকা d অরবিটাল নেই, তাই পানির আক্রমণ গ্রহণ করতে পারে না; NaCl সবল এসিড-সবল ক্ষারের লবণ। SiCl₄ এর ফাঁকা 3d অরবিটাল থাকায় আর্দ্রবিশ্লেষিত হয়: SiCl₄ + 4H₂O → Si(OH)₄ + 4HCl। (b) CuSO₄ + 2NH₄OH → Cu(OH)₂↓ (হালকা নীল) + (NH₄)₂SO₄; অতিরিক্ত NH₃ এ Cu(OH)₂ + 4NH₃ → [Cu(NH₃)₄]²⁺ (গাঢ় নীল) + 2OH⁻।"],["mat","২০২৫","একটি বস্তুকে ভূমি হতে 100 ft/s বেগে অনুভূমিকের সাথে cos⁻¹(3/5) কোণে নিক্ষেপ করা হলো। 2 s পরে নিক্ষেপণ বিন্দু হতে বস্তুটির দূরত্ব নির্ণয় কর।","cos θ = 3/5, sin θ = 4/5, g = 32 ft/s²। x = 60 × 2 = 120 ft; y = 80 × 2 − ½ × 32 × 4 = 96 ft। দূরত্ব = √(120² + 96²) = 24√41 ≈ 153.7 ft।"],["mat","২০২৫","x = y² এবং y = x − 2 দ্বারা আবদ্ধ ক্ষেত্রের ক্ষেত্রফল নির্ণয় কর।","ছেদবিন্দু: y² = y + 2 ⇒ y = −1, 2। ক্ষেত্রফল = ∫₋₁² (y + 2 − y²) dy = [y²/2 + 2y − y³/3]₋₁² = 10/3 + 7/6 = 9/2 বর্গ একক।"],["mat","২০২৫","একটি বৃত্তের সমীকরণ নির্ণয় কর যা x-অক্ষকে (4, 0) বিন্দুতে স্পর্শ করে এবং y-অক্ষ থেকে 4 একক দৈর্ঘ্যের জ্যা ছেদ করে।","কেন্দ্র (4, k), ব্যাসার্ধ |k|। y-অক্ষে জ্যা = 2√(k² − 16) = 4 ⇒ k² = 20 ⇒ k = ±2√5। সমীকরণ: x² + y² − 8x ∓ 4√5 y + 16 = 0।"],["mat","২০২৫","27x² + 6x − (p + 2) = 0 সমীকরণের একটি মূল অপরটির বর্গ হলে p এর মান বের কর।","মূল α, α²: α + α² = −2/9 ⇒ 9α² + 9α + 2 = 0 ⇒ α = −1/3 বা −2/3। গুণফল α³ = −(p + 2)/27 ⇒ p + 2 = 1 বা 8 ⇒ p = −1 বা 6।"],["mat","২০২৫","x = 1, y = x − 2 এবং y² = x দ্বারা আবদ্ধ ক্ষেত্রের ক্ষেত্রফল নির্ণয় কর।","রেখা ও পরাবৃত্ত (1, −1) ও (4, 2) এ মেলে। ক্ষেত্রফল = ∫₁⁴ (√x − x + 2) dx = [⅔x^(3/2) − x²/2 + 2x]₁⁴ = 16/3 − 13/6 = 19/6 বর্গ একক।"],["mat","২০২৫","দেখাও যে x² + y² − 4x + 6y + 8 = 0 এবং x² + y² − 10x − 6y + 14 = 0 বৃত্তদ্বয় পরস্পরকে স্পর্শ করে এবং স্পর্শবিন্দুর স্থানাঙ্ক নির্ণয় কর।","কেন্দ্র (2, −3), r₁ = √5; কেন্দ্র (5, 3), r₂ = 2√5। কেন্দ্রদ্বয়ের দূরত্ব = √(9 + 36) = 3√5 = r₁ + r₂, তাই বহিঃস্থভাবে স্পর্শ করে। স্পর্শবিন্দু কেন্দ্রদ্বয়ের সংযোগ রেখাকে 1 : 2 অনুপাতে অন্তর্বিভক্ত করে: (3, −1)।"],["mat","২০২৫","|z + 1| = z + 2(1 + i) সমীকরণটি সিদ্ধ করে এমন জটিল সংখ্যা z নির্ণয় কর।","z = x + iy। বামপক্ষ বাস্তব, তাই y + 2 = 0 ⇒ y = −2। √((x + 1)² + 4) = x + 2 ⇒ 2x + 5 = 4x + 4 ⇒ x = ½। z = ½ − 2i।"],["bio","২০২৫","আইলেটস অব ল্যাঙ্গারহ্যান্স কোথায় অবস্থিত? এর চার ধরনের কোষ ও তাদের নিঃসৃত হরমোনের নাম লিখ।","অগ্ন্যাশয়ের অন্তঃক্ষরা অংশে। α কোষ: গ্লুকাগন; β কোষ: ইনসুলিন; δ কোষ: সোমাটোস্ট্যাটিন; F (PP) কোষ: প্যানক্রিয়াটিক পলিপেপটাইড।"],["bio","২০২৫","Chondrichthyes ও Actinopterygii শ্রেণির মধ্যে পাঁচটি পার্থক্য লিখ।","কঙ্কাল তরুণাস্থির বনাম অস্থির; ফুলকা ছিদ্র ৫–৭ জোড়া খোলা বনাম কানকো দিয়ে ঢাকা; প্ল্যাকয়েড আঁইশ বনাম সাইক্লয়েড/টিনয়েড আঁইশ; মুখ অঙ্কীয় বনাম অগ্রপ্রান্তীয়; বায়ুথলি নেই বনাম আছে; পুচ্ছপাখনা হেটারোসার্কাল বনাম হোমোসার্কাল।"],["bio","২০২৫","উদাহরণসহ Poaceae গোত্রের চারটি শনাক্তকারী বৈশিষ্ট্য লিখ।","কাণ্ড ফাঁপা পর্বযুক্ত (কাল্‌ম); পাতায় লিগিউল ও পত্রমূল আবরণী; পুষ্প স্পাইকলেটে, লেমা-প্যালিয়াযুক্ত; ফল ক্যারিওপসিস। উদাহরণ: ধান (Oryza sativa), গম, বাঁশ।"],["bio","২০২৫","মাইটোকন্ড্রিয়া ও প্লাস্টিডের মধ্যে পাঁচটি সাদৃশ্য লিখ।","দুটিই দ্বিস্তরী ঝিল্লিবেষ্টিত; দুটিতেই নিজস্ব বৃত্তাকার DNA আছে; দুটিতেই 70S রাইবোজোম আছে; দুটিই ATP তৈরি করে (শক্তি রূপান্তর); দুটিই বিভাজনে নিজেরা সংখ্যা বাড়ায়, অর্ধস্বায়ত্তশাসিত অঙ্গাণু।"],["bio","২০২৫","মানুষের খাদ্য পরিপা function reviewLines(k){
 const queue=shuffle(dueOf(k));let i=0,shown=false,ok=0;
 const render=()=>{
  if(i>=queue.length){CUR=()=>unitMemo(k);app.innerHTML=hubFrame(k,"memo",`<section class="sheet"><div class="k">Review done</div><div class="score">${ok}/${queue.length}</div><p class="note">Lines you forgot come back in 10 minutes. The rest come back on their schedule.</p><div class="row"><a class="btn unit-btn" href="#${k}-memo">Back to my lines</a></div></section>`);return}
  CUR=render;const l=queue[i];
  app.innerHTML=hubFrame(k,"memo",`<div class="row" style="justify-content:space-between"><span class="note" style="margin:0">Line ${i+1} of ${queue.length} · ${SUBJ[l.s].n} ${chLabel(l.ch)}</span></div>
   <div class="progress"><i style="width:${i/queue.length*100}%"></i></div>
   <section class="sheet"><div class="linetext big">${blanked(l,shown)}</div>
   <div class="row" style="margin-top:14px">${shown?`<button class="btn unit-btn" id="knew">I remembered</button><button class="btn ghost" id="forgot">I forgot</button>`:`<button class="btn unit-btn" id="show">Say it in your head, then show</button>`}</div></section>`);
  if(!shown){$("#show").onclick=()=>{shown=true;render()};return}
  $("#knew").onclick=async()=>{ok++;const step=Math.min((l.step||0)+1,STEPS.length);await saveLine({...l,step,due:Date.now()+STEPS[step-1]*864e5});i++;shown=false;render()};
  $("#forgot").onclick=async()=>{await saveLine({...l,step:0,due:Date.now()+6e5});i++;shown=false;render()};
 };
 render();
}

  "2-1":["সমোষ্ণ → তাপমাত্রা স্থির (ΔU = 0) · রুদ্ধতাপীয় → তাপ আদান-প্রদান নেই (Q = 0) · সমচাপ → চাপ স্থির · সমআয়তন → আয়তন স্থির (W = 0)।"],
  "2-2":["ধারক রোধের উল্টো: সমান্তরালে যোগ হয়, শ্রেণিতে বিপরীতের যোগ হয়।","কুলম্বের সূত্র: F = kq₁q₂/r², k = 9 × 10⁹।"],
  "2-3":["R = ρL/A: দৈর্ঘ্য দ্বিগুণ → R দ্বিগুণ; ব্যাস দ্বিগুণ → R/4।","P = VI = I²R = V²/R — যে মানগুলো দেওয়া আছে সেটি ব্যবহার করো।"],
  "2-4":["“বাম মোটর, ডান জেনারেটর”: ফ্লেমিংয়ের বাম হাতের নিয়মে মোটরের বল, ডান হাতের নিয়মে আবিষ্ট প্রবাহ।"],
  "2-5":["ε = −dΦ/dt; ঋণচিহ্ন লেঞ্জের সূত্র — আবিষ্ট প্রবাহ পরিবর্তনকে বাধা দেয়।","ট্রান্সফর্মার: Vs/Vp = Ns/Np। আরোহী ট্রান্সফর্মার বিভব বাড়ায়, প্রবাহ কমায়।"],
  "2-6":["অভিসারী: উত্তল লেন্স, অবতল দর্পণ। অপসারী: অবতল লেন্স, উত্তল দর্পণ। P = 1/f (মিটারে)।","পূর্ণ অভ্যন্তরীণ প্রতিফলনে লাগে ঘন → হালকা মাধ্যম ও কোণ > সংকট কোণ: অপটিক্যাল ফাইবার, হীরার ঝলক, মরীচিকা।"],
  "2-7":["ব্যতিচারে সুসংগত উৎস লাগে (ইয়ং-এর দ্বি-চিড়)। সমবর্তন প্রমাণ করে আলো আড় তরঙ্গ।"],
  "2-8":["E = hf = hc/λ: তরঙ্গদৈর্ঘ্য যত ছোট, শক্তি তত বেশি।","আলোক-তড়িৎ নিঃসরণ কম্পাঙ্কের উপর নির্ভর করে, উজ্জ্বলতার উপর নয়।"],
  "2-9":["α = হিলিয়াম নিউক্লিয়াস, কাগজে থামে · β = ইলেকট্রন, অ্যালুমিনিয়ামে থামে · γ = তাড়িতচৌম্বক তরঙ্গ, সিসা লাগে।","n টি অর্ধায়ু পরে (½)ⁿ অংশ থাকে।"],
  "2-10":["“P মানে Positive হোল”: p-টাইপে ত্রিযোজী B, Al, Ga (হোল সংখ্যাগুরু); n-টাইপে পঞ্চযোজী P, As, Sb (ইলেকট্রন সংখ্যাগুরু)।"],
  "2-11":["সূর্য নিকটতম নক্ষত্র; এর পরে প্রক্সিমা সেন্টরি, প্রায় ৪.২ আলোকবর্ষ দূরে।","আলোকবর্ষ দূরত্বের একক, সময়ের নয়।"]},
 che:{"1-1":["বৈদ্যুতিক আগুনে → CO₂ অগ্নিনির্বাপক, কখনো পানি নয়। ত্বকে এসিড → প্রচুর প্রবাহমান পানি।","সবসময় পানিতে এসিড মেশাও, এসিডে পানি নয়।"],
  "1-2":["শক্তিস্তরের ধারণক্ষমতা 2n²: 2, 8, 18, 32। অরবিটাল: s 1, p 3, d 5, f 7 (ইলেকট্রন 2, 6, 10, 14)।","শিখার রং: Na সোনালি হলুদ · K হালকা বেগুনি · Ca ইটের মতো লাল · Ba আপেল সবুজ · Cu নীলাভ সবুজ।"],
  "1-3":["পর্যায়ে বাম থেকে ডানে: ব্যাসার্ধ ↓, তড়িৎঋণাত্মকতা ↑। গ্রুপে উপর থেকে নিচে: ব্যাসার্ধ ↑ (Li < Na < K < Cs)। F সবচেয়ে তড়িৎঋণাত্মক।","আকৃতি: ২ জোড় রৈখিক 180° · ৩ ত্রিকোণীয় 120° · ৪ চতুস্তলকীয় 109.5°। নিঃসঙ্গ জোড় কোণ কমায়: NH₃ 107°, H₂O 104.5°।"],
  "1-4":["pH = −log[H⁺]; ১ pH একক = [H⁺] এর ১০ গুণ।","K শুধু তাপমাত্রায় বদলায়। প্রভাবক দুই দিকের গতিই বাড়ায়, K একই থাকে।"],
  "1-5":["সাবান = চর্বি + NaOH (সাবানায়ন)। ভিনেগার = ৪–৮% অ্যাসিটিক এসিড। প্রাকৃতিক গ্যাস ≈ বেশিরভাগ মিথেন।"],
  "2-1":["বয়েল: P↑ → V↓ (T স্থির)। চার্লস: V ∝ T (P স্থির)। STP: 0 °C, 1 atm, 22.4 L/mol।","এসিড বৃষ্টি: SO₂, NOₓ · ওজোন ক্ষয়: CFC · গ্রিনহাউস: CO₂, CH₄।"],
  "2-2":["কার্বন সংখ্যা: meth 1, eth 2, prop 3, but 4 — “Monkeys Eat Peeled Bananas”।","শেষাংশ: -ol অ্যালকোহল (–OH) · -al অ্যালডিহাইড (–CHO) · -one কিটোন (–CO–) · -oic এসিড (–COOH)।","টলেন রুপালি দর্পণ → অ্যালডিহাইড। ব্রোমিন পানি বর্ণহীন → C=C বা C≡C।"],
  "2-3":["মোল = ভর ÷ মোলার ভর = কণা ÷ 6.022 × 10²³ = STP তে আয়তন ÷ 22.4 L।","মোলারিটি = মোল ÷ দ্রবণের লিটার।"],
  "2-4":["OIL RIG: জারণ = ইলেকট্রন ত্যাগ, বিজারণ = ইলেকট্রন গ্রহণ।","“An Ox, Red Cat”: অ্যানোডে জারণ, ক্যাথোডে বিজারণ। 1 F = 96500 C।"],
  "2-5":["ইউরিয়া CO(NH₂)₂ প্রায় ৪৬% নাইট্রোজেনযুক্ত সার।"]},
 mat:{"1-1":["2×2 বিপরীত: মূল কর্ণের উপাদান অদলবদল, অন্য দুটির চিহ্ন বদল, তারপর det (ad − bc) দিয়ে ভাগ।","det = 0 → ব্যতিক্রমী → বিপরীত নেই।"],
  "1-2":["লম্ব → ডট গুণফল 0। |ai + bj + ck| = √(a² + b² + c²)।"],
  "1-3":["ax + by + c = 0 এর ঢাল −a/b। সমান্তরাল: ঢাল সমান। লম্ব: m₁m₂ = −1।"],
  "1-4":["বৃত্ত x² + y² + 2gx + 2fy + c = 0: x ও y এর সহগ অর্ধেক করে চিহ্ন বদলালে কেন্দ্র (−g, −f); r = √(g² + f² − c)।"],
  "1-5":["বিন্যাস = সাজানো (ক্রম গুরুত্বপূর্ণ)। সমাবেশ = বাছাই (ক্রম গুরুত্বপূর্ণ নয়)।","পুনরাবৃত্ত অক্ষর: প্রতিটি পুনরাবৃত্তির ফ্যাক্টরিয়াল দিয়ে ভাগ। ⁿCᵣ = ⁿCₙ₋ᵣ।"],
  "1-6":["“All Silver Tea Cups”: ১ম চতুর্ভাগে সব +, ২য়তে sin +, ৩য়তে tan +, ৪র্থতে cos +।","sin 30° = 1/2, sin 45° = 1/√2, sin 60° = √3/2; cos উল্টো ক্রমে।"],
  "1-7":["90° বা 270° → sin ↔ cos বদল (tan ↔ cot)। 180° বা 360° → একই ফাংশন। চিহ্ন আসে চতুর্ভাগ থেকে।"],
  "1-8":["ডোমেন যাচাই: √g(x) এ g(x) ≥ 0 · 1/g(x) এ g(x) ≠ 0 · log g(x) এ g(x) > 0।"],
  "1-9":["গুরুমান/লঘুমান: dy/dx = 0 বসাও; দ্বিতীয় অন্তরজ < 0 → গুরুমান, > 0 → লঘুমান।","গুণফলের সূত্র: (uv)′ = u′v + uv′।"],
  "1-10":[null,"নির্দিষ্ট যোগজ হলো বক্ররেখার নিচের ক্ষেত্রফল।"],
  "2-1":["|x − a| < b ⇔ a − b < x < a + b। |x − a| > b ⇔ x < a − b অথবা x > a + b।"],
  "2-2":["যোগাশ্রয়ী প্রোগ্রামের অনুকূল মান সবসময় কৌণিক বিন্দুতে — প্রতিটি শীর্ষবিন্দু যাচাই করো।"],
  "2-3":["i এর ঘাত প্রতি ৪টিতে পুনরাবৃত্ত হয়: i, −1, −i, 1। অনুবন্ধীতে কাল্পনিক অংশের চিহ্ন বদলায়।"],
  "2-4":["মূলদ্বয়ের যোগফল −b/a, গুণফল c/a। নিশ্চায়ক b² − 4ac: > 0 বাস্তব ও অসমান, = 0 সমান, < 0 জটিল।"],
  "2-5":["(a + b)ⁿ এ n + 1 টি পদ; সাধারণ পদ Tᵣ₊₁ = ⁿCᵣ aⁿ⁻ʳ bʳ।"],
  "2-6":["উৎকেন্দ্রিকতা: বৃত্ত 0 · উপবৃত্ত < 1 · পরাবৃত্ত = 1 · অধিবৃত্ত > 1।","y² = 4ax: উপকেন্দ্র (a, 0), দিকাক্ষ x = −a, উপকেন্দ্রিক লম্ব 4a।"],
  "2-7":[null],
  "2-8":["R² = P² + Q² + 2PQ cos α। 120° কোণে দুটি সমান বলের লব্ধি প্রতিটি বলের সমান।"],
  "2-9":["প্রক্ষেপক: পাল্লা u² sin 2θ / g (45° তে সর্বোচ্চ) · উচ্চতা u² sin²θ / 2g · সময় 2u sin θ / g।"],
  "2-10":["P(অন্তত একটি) = 1 − P(একটিও না)। সম্ভাবনা সবসময় 0 ও 1 এর মধ্যে।"]},
 bot:{"gen":["উদ্ভিদবিজ্ঞান: থিওফ্রাস্টাস · প্রাণিবিজ্ঞান: অ্যারিস্টটল · দ্বিপদ নামকরণ: লিনিয়াস।"],
  "1-1":["রাইবোসোম = প্রোটিন কারখানা (ঝিল্লিহীন) · গলজি = ডাকঘর · লাইসোসোম = আত্মঘাতী থলি।","নিজস্ব DNA: মাইটোকন্ড্রিয়া ও ক্লোরোপ্লাস্ট।"],
  "1-2":["মাইটোসিস “PMAT”: প্রোফেজ · মেটাফেজ (মাঝে সারি) · অ্যানাফেজ (দুই দিকে সরে) · টেলোফেজ (দুটি নিউক্লিয়াস)।","মিয়োসিস: 2n → ৪টি n কোষ; ক্রসিং ওভার প্রোফেজ-১ এ (প্যাকাইটিন)।"],
  "1-3":["এনজাইম মূলত প্রোটিন। শ্বেতসার → গ্লুকোজ · প্রোটিন → অ্যামাইনো এসিড · চর্বি → ফ্যাটি এসিড + গ্লিসারল।"],
  "1-4":["ভাইরাস শুধু জীবিত কোষে সংখ্যাবৃদ্ধি করে। ব্যাকটেরিয়ার DNA নিউক্লিয়য়েডে — নিউক্লিয়ার ঝিল্লি নেই।"],
  "1-5":["আগার লোহিত শৈবাল (Gelidium) থেকে। পেনিসিলিন Penicillium ছত্রাক থেকে (ফ্লেমিং, ১৯২৮)।"],
  "1-6":["মস: গ্যামিটোফাইট প্রধান, সংবহন টিস্যু নেই। ফার্ন: স্পোরোফাইট প্রধান, সংবহন টিস্যু আছে, বীজ নেই।"],
  "1-7":["নগ্নবীজী = নগ্ন বীজ (সাইকাস, পাইন)। আবৃতবীজী = ফলের ভিতরে বীজ, দ্বি-নিষেক।"],
  "1-8":["জাইলেম পানি নিয়ে উপরে ওঠে; ফ্লোয়েম খাদ্য দুই দিকেই বহন করে।","শীর্ষস্থ ভাজক → দৈর্ঘ্য; পার্শ্বীয় ভাজক (ক্যাম্বিয়াম) → পুরুত্ব।"],
  "1-9":["আলোক বিক্রিয়া: থাইলাকয়েড, O₂ আসে পানি থেকে। ক্যালভিন চক্র: স্ট্রোমা, প্রথম উৎপাদ PGA।","গ্লাইকোলাইসিস: সাইটোপ্লাজম, নিট ২ ATP। ক্রেবস: মাইটোকন্ড্রিয়ার ম্যাট্রিক্স।"],
  "1-10":["পরাগায়ন: অ্যানিমো = বায়ু · এন্টোমো = পতঙ্গ · হাইড্রো = পানি · জু = প্রাণী।","ডিম্বাণু + শুক্রাণু = 2n জাইগোট; পোলার নিউক্লিয়াস + শুক্রাণু = 3n সস্য।"],
  "1-11":["রেস্ট্রিকশন এনজাইম = কাঁচি (DNA কাটে); লাইগেজ = আঠা (DNA জোড়া দেয়)।"],
  "1-12":["সুন্দরবন: বৃহত্তম ম্যানগ্রোভ বন; শ্বাসমূল (নিউমাটোফোর), লবণসহিষ্ণু উদ্ভিদ।"]},

const PAT=[

const PAPER={"1":"১ম পত্র","2":"২য় পত্র"};
function tx(t){
 return t.replace(/Paper (\d) · Ch (\d+)/g,(_,p,c)=>`${PAPER[p]} · অধ্যায় ${c}`).replace(subjRe,s=>SUBJ_BN[s]||s)
  .replace(/^MCQ /,"এমসিকিউ ").replace(/ \+ written /," + লিখিত ").replace(/ \(finish marking to get the final total\)/," (চূড়ান্ত মোট পেতে সব নম্বর দেওয়া শেষ করো)")
  .replace(/^Best mock: /,"সেরা মক: ").replace(/ You chose (\S+)\./g," তুমি বেছেছিলে $1।");
}
function trText(t){
 const k=t.trim();if(!k)return t;
 if(UI[k])return t.replace(k,UI[k]);
 if(MOCKREAL_BN[k])return t.replace(k,MOCKREAL_BN[k]);
 // chapter names "English · বাংলা" → Bangla part
 const ch=k.match(/^(.+?) · ([ঀ-৿].*)$/);if(ch)return t.replace(k,ch[2]);
 for(const [re,fn] of PAT){const m=t.match(re);if(m)return fn(m)}
 const subbed=tx(t);return subbed;
}
const SKIP=".rule,.qtext,.opts,.linetext,.facts-list,.tight,.checks,.wbox,textarea,.alt,.nt,input,select option,script,style";
function translateTree(root){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const n of nodes){
  const p=n.parentElement;if(!p||p.closest(SKIP))continue;
  if(n.__en===undefined||(n.nodeValue!==n.__bn))n.__en=n.nodeValue;
  const out=LANG==="en"?n.__en:trText(n.__en);
  if(out!==n.nodeValue){n.nodeValue=out}
  n.__bn=out;
 }
 root.querySelectorAll&&root.querySelectorAll("[placeholder]").forEach(el=>{if(!el.dataset.ph)el.dataset.ph=el.placeholder;el.placeholder=LANG==="en"?el.dataset.ph:"এখানে উত্তর লেখো, অথবা খাতায়"});
 root.querySelectorAll&&root.querySelectorAll("select option").forEach(o=>{if(o.dataset.en===undefined)o.dataset.en=o.textContent;o.textContent=LANG==="en"?o.dataset.en:trText(o.dataset.en)});
}
const obs=new MutationObserver(ms=>{if(LANG==="en")return;for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===1)translateTree(n);else if(n.nodeType===3&&n.parentElement)translateTree(n.parentElement)}});
obs.observe(document.body,{childList:true,subtree:true});
function applyLang(){document.documentElement.lang=LANG==="en"?"en":"bn";translateTree(document.body)}
